<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Business Card</title>
  
  <!-- A-Frame & AR.js NFT -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <!-- 軽量・安定化したグリーンバック透過カスタムシェーダー -->
  <script>
    AFRAME.registerComponent('chromakey', {
      schema: {
        color: {type: 'color', default: '#327c32'},
        similarity: {type: 'number', default: 0.15},
        smoothness: {type: 'number', default: 0.05}
      },
      init: function () {
        const video = document.querySelector('#ar-video');
        
        // VideoTextureを作成
        const texture = new THREE.VideoTexture(video);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.format = THREE.RGBAFormat;

        const keyColor = new THREE.Color(this.data.color);

        // シェーダーマテリアルの生成
        this.material = new THREE.ShaderMaterial({
          uniforms: {
            color: { type: 'c', value: keyColor },
            texture: { type: 't', value: texture },
            similarity: { type: 'f', value: this.data.similarity },
            smoothness: { type: 'f', value: this.data.smoothness }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform vec3 color;
            uniform sampler2D texture;
            uniform float similarity;
            uniform float smoothness;
            varying vec2 vUv;
            
            void main() {
              vec4 texColor = texture2D(texture, vUv);
              
              // グリーンバック計算の簡略化（負荷軽減）
              float greenDiff = texColor.g - max(texColor.r, texColor.b);
              float alpha = 1.0 - smoothstep(similarity, similarity + smoothness, greenDiff);
              
              // 足元のフェード処理
              float bottomFade = smoothstep(0.0, 0.08, vUv.y);
              alpha *= bottomFade;

              gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
            }
          `,
          transparent: true,
          side: THREE.DoubleSide
        });

        this.el.addEventListener('model-loaded', () => this.applyMaterial());
        this.applyMaterial();
      },
      applyMaterial: function () {
        const mesh = this.el.getObject3D('mesh');
        if (mesh) {
          mesh.material = this.material;
        }
      }
    });
  </script>

  <style>
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }
    .start-btn {
      margin-top: 20px;
      padding: 14px 28px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <!-- スタート / ローディング画面 -->
  <div class="arjs-loader" id="loader">
    <div id="loading-text" style="text-align: center; line-height: 1.6;">ARデータを読み込んでいます...</div>
    <button class="start-btn" id="start-btn">音声付きでARを開始する</button>
  </div>

  <!-- レンダラー設定を軽量化 -->
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="alpha: true; antialias: false;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <video id="ar-video" src="./0723.mp4" loop playsinline webkit-playsinline crossorigin="anonymous" preload="auto" muted></video>
    </a-assets>

    <a-nft
      type="nft"
      url="https://shou1512.github.io/ar-card/moriwaki"
      smooth="true"
      smoothCount="30"
      smoothTolerance="0.05"
      smoothThreshold="10"
    >
      <a-video
        id="ar-video-entity"
        src="#ar-video"
        width="450"
        height="800"
        position="150 0 -100"
        rotation="-90 0 0"
        chromakey
        visible="false"
      ></a-video>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loader = document.getElementById('loader');
    const loadingText = document.getElementById('loading-text');
    const startBtn = document.getElementById('start-btn');
    const nftTarget = document.querySelector('a-nft');
    const video = document.querySelector('#ar-video');
    const videoEntity = document.querySelector('#ar-video-entity');

    function showStartButton() {
      loadingText.innerHTML = "準備完了！<br>ボタンを押して名刺にかざしてください";
      startBtn.style.display = 'block';
    }

    window.addEventListener('arjs-nft-loaded', showStartButton);
    
    document.querySelector('a-scene').addEventListener('loaded', function () {
      setTimeout(function() {
        if (startBtn.style.display !== 'block') {
          showStartButton();
        }
      }, 2000);
    });

    // ボタンタップ時：一度だけ動画を再生＆一時停止して、ブラウザの再生制限を解除しておく
    startBtn.addEventListener('click', function() {
      video.play().then(() => {
        video.pause();
        loader.style.display = 'none';
      }).catch(err => {
        console.log("Play failed:", err);
        loader.style.display = 'none';
      });
    });

    // 名刺認識時：ミュート解除＆再生開始（音声あり再生がブロックされた場合は自動でミュート再生へ切り替え）
    nftTarget.addEventListener('markerFound', function() {
      console.log('Marker Found!');
      videoEntity.setAttribute('visible', 'true');
      video.muted = false;
      
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.log("Autoplay with sound failed, trying muted:", error);
          video.muted = true;
          video.play();
        });
      }
    });

    // 名刺を見失った時：動画を一時停止して非表示
    nftTarget.addEventListener('markerLost', function() {
      console.log('Marker Lost!');
      videoEntity.setAttribute('visible', 'false');
      video.pause();
    });
  </script>
</body>
</html>
