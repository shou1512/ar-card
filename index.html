<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Business Card</title>
  
  <!-- A-Frame & AR.js NFT（動く版と同一バージョン） -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <style>
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }
    .start-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.1em;
      cursor: pointer;
      display: none;
    }
    /* AR.js のデバッグUIが万一被っても困らないように明示非表示 */
    .a-enter-vr-button { display: none !important; }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <!-- ローディング画面 -->
  <div class="arjs-loader" id="loader">
    <div id="loading-text">名刺データを読み込んでいます...</div>
    <button class="start-btn" id="start-btn">ARを開始する</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <!-- muted で一度自動再生可能化、iOS Safari 対策の playsinline / webkit-playsinline を維持 -->
      <video id="ar-video" src="./0723.mp4" loop crossorigin="anonymous"
             playsinline webkit-playsinline muted preload="metadata"></video>
    </a-assets>

    <!-- NFTマーカー（動く版と同じ絶対パス指定で GitHub Pages の .fset / .fset3 / .iset を解決） -->
    <a-nft
      type="nft"
      url="https://shou1512.github.io/ar-card/moriwaki"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <!-- chromakey は外し、a-video 標準の描画パイプラインに戻す -->
      <a-video
        src="#ar-video"
        width="160"
        height="284"
        position="50 0 -100"
        rotation="-90 0 0"
      ></a-video>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loader      = document.getElementById('loader');
    const loadingText = document.getElementById('loading-text');
    const startBtn    = document.getElementById('start-btn');
    const nftTarget   = document.querySelector('a-nft');
    const video       = document.querySelector('#ar-video');

    function showStartButton() {
      loadingText.innerHTML = "準備完了！<br>ボタンを押して名刺にかざしてください";
      startBtn.style.display = 'block';
    }

    // NFT データが読み込まれたらボタンを表示
    window.addEventListener('arjs-nft-loaded', showStartButton);

    // フォールバック：シーン起動から2秒経っても上記が来なければ強制で表示
    document.querySelector('a-scene').addEventListener('loaded', function () {
      setTimeout(function () {
        if (startBtn.style.display !== 'block') showStartButton();
      }, 2000);
    });

    // スタートボタン：ユーザー操作の中で一度だけ play() を呼んで音声解錠
    startBtn.addEventListener('click', function () {
      video.muted = false;                 // 音声ON
      video.play().then(() => {
        video.pause();                     // iOS などで常時再生させず許可だけ取る
        video.currentTime = 0;
        loader.style.display = 'none';     // ローダー消去
      }).catch(err => {
        // 失敗しても無音モードで続行
        console.log('Video play error:', err);
        video.muted = true;
        video.play().then(() => {
          video.pause();
        }).catch(() => {});
        loader.style.display = 'none';
      });
    });

    // マーカー認識時に再生（頭出し）
    nftTarget.addEventListener('markerFound', function () {
      console.log('Marker Found!');
      try { video.currentTime = 0; } catch (e) {}
      video.play().catch(e => console.log('Play error:', e));
    });

    // マーカー見失い時に停止
    nftTarget.addEventListener('markerLost', function () {
      console.log('Marker Lost!');
      video.pause();
    });
  </script>
</body>
</html>
