<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Business Card - 透過動画（Debug）</title>

  <!-- A-Frame & AR.js NFT -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <!-- ★chromakey シェーダー（init() で直接 VideoTexture をバインドする方式が一番確実）
       schema の src 依存を排除し、初期化のタイミングで確実にテクスチャを取れるようにしている。 -->
  <script>
    AFRAME.registerShader('chromakey', {
      schema: {
        color:      { type: 'color',  default: '#00b140' },
        similarity: { type: 'number', default: 0.40 },
        smoothness: { type: 'number', default: 0.10 }
      },

      init: function () {
        // ★重要: 毎フレーム texture を VideoTexture にラップし直す
        // そうしないと「video 未ロード → テクスチャ未生成」になるケースに引っかかる。
        const video = document.querySelector('#ar-video');

        const texture = new THREE.VideoTexture(video);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.format    = THREE.RGBAFormat;
        texture.colorSpace = THREE.SRGBColorSpace;

        const color = new THREE.Color(this.data.color);

        this.material = new THREE.ShaderMaterial({
          uniforms: {
            color:      { value: color },
            texture:    { value: texture },
            similarity: { value: this.data.similarity },
            smoothness: { value: this.data.smoothness }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform vec3      color;
            uniform sampler2D texture;
            uniform float     similarity;
            uniform float     smoothness;
            varying vec2      vUv;
            void main() {
              vec4 tex = texture2D(texture, vUv);
              float d   = distance(tex.rgb, color);
              float a   = smoothstep(similarity, similarity + smoothness, d);
              gl_FragColor = vec4(tex.rgb, a);
            }
          `,
          transparent: true,
          side: THREE.DoubleSide
        });

        // A-Frame の material パイプラインに material を入れる
        this.el.material = this.material;
      },

      update: function (data) {
        if (!this.material) return;
        this.material.uniforms.color.value.set(data.color);
        this.material.uniforms.similarity.value = data.similarity;
        this.material.uniforms.smoothness.value = data.smoothness;
      }
    });
  </script>

  <style>
    .arjs-loader {
      height: 100%; width: 100%;
      position: absolute; top: 0; left: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; font-family: sans-serif;
    }
    .start-btn {
      margin-top: 20px; padding: 14px 28px;
      background-color: #007bff; color: white;
      border: none; border-radius: 25px;
      font-size: 1.1em; cursor: pointer; display: none;
    }
    .a-enter-vr-button { display: none !important; }

    /* ★デバッグパネル */
    #debug-panel {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.75); color: #ddd;
      padding: 8px 12px; font-family: monospace; font-size: 12px;
      z-index: 10000; border: 1px solid #555; border-radius: 4px;
      line-height: 1.5;
    }
    #debug-panel .ok  { color: #4f4; }
    #debug-panel .err { color: #f55; }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <div class="arjs-loader" id="loader">
    <div id="loading-text">名刺データを読み込んでいます...</div>
    <button class="start-btn" id="start-btn">ARを開始する</button>
  </div>

  <!-- ★左上にデバッグパネル。問題の切り分け用 -->
  <div id="debug-panel">
    <div>NFT認識: <span id="dbg-marker" class="err">未認識</span></div>
    <div>readyState: <span id="dbg-rs">-</span></div>
    <div>paused:     <span id="dbg-paused">-</span></div>
    <div>muted:      <span id="dbg-muted">-</span></div>
    <div>currTime:   <span id="dbg-ct">-</span></div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <video id="ar-video" src="./0723.mp4" loop crossorigin="anonymous"
             playsinline webkit-playsinline muted preload="auto"></video>
    </a-assets>

    <a-nft
      type="nft"
      url="https://shou1512.github.io/ar-card/moriwaki"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <!-- ★マーカー認識テスト用の赤いプレーン。
           これがカメラに映れば = マーカー認識OK。
           映らない = マーカー側（URL / パスの解決 / 印刷精度） -->
      <a-plane color="#ff2222" width="20" height="20"
               position="0 70 0" rotation="-90 0 0"></a-plane>

      <!-- ★ 透過動画プレーン
           width 240 height 135 = mp4 を広めに表示（名刺平面より少し大きく）
           position: 名刺の中央高さに置く。y 70 = 「名刺の上」を狙う
           rotation: -90 0 0 でプレーンを水平にして上向きに表示 -->
      <a-entity
        geometry="primitive: plane; width: 240; height: 135"
        material="shader: chromakey;
                  color: #00b140;
                  similarity: 0.40;
                  smoothness: 0.10;
                  transparent: true;
                  side: double"
        position="0 70 2"
        rotation="-90 0 0"
      ></a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loader      = document.getElementById('loader');
    const loadingText = document.getElementById('loading-text');
    const startBtn    = document.getElementById('start-btn');
    const nftTarget   = document.querySelector('a-nft');
    const video       = document.querySelector('#ar-video');

    const dbgMarker = document.getElementById('dbg-marker');
    const dbgRS     = document.getElementById('dbg-rs');
    const dbgPaused = document.getElementById('dbg-paused');
    const dbgMuted  = document.getElementById('dbg-muted');
    const dbgCT     = document.getElementById('dbg-ct');

    function showStartButton() {
      loadingText.innerHTML = "準備完了！<br>ボタンを押して名刺にかざしてください";
      startBtn.style.display = 'block';
    }
    window.addEventListener('arjs-nft-loaded', showStartButton);
    document.querySelector('a-scene').addEventListener('loaded', function () {
      setTimeout(function () {
        if (startBtn.style.display !== 'block') showStartButton();
      }, 2000);
    });

    // ユーザー操作の中で必ず一度 video.play() を呼ぶ
    // （モバイル Safari は user gesture 必須）
    startBtn.addEventListener('click', function () {
      video.muted = true;
      video.play().then(() => {
        video.pause();
        video.currentTime = 0;
        loader.style.display = 'none';
      }).catch(err => {
        console.log('Video play error:', err);
        loader.style.display = 'none';
      });
    });

    nftTarget.addEventListener('markerFound', function () {
      console.log('Marker Found!');
      dbgMarker.textContent = '認識中';
      dbgMarker.className   = 'ok';
      try { video.currentTime = 0; } catch (e) {}
      video.play().catch(e => console.log('Play error:', e));
    });

    nftTarget.addEventListener('markerLost', function () {
      console.log('Marker Lost!');
      dbgMarker.textContent = '未認識';
      dbgMarker.className   = 'err';
      video.pause();
    });

    // デバッグパネルの情報更新
    setInterval(() => {
      dbgRS.textContent     = video.readyState;
      dbgPaused.textContent = String(video.paused);
      dbgMuted.textContent  = String(video.muted);
      dbgCT.textContent     = video.currentTime.toFixed(2);
    }, 200);
  </script>
</body>
</html>
