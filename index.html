<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Business Card</title>

  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <style>
    .overlay {
      position: absolute; top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color:#fff; font-family: sans-serif; text-align:center;
      padding: 0 24px;
    }
    .overlay.hidden { display:none; }
    .btn {
      margin-top:20px; padding:14px 28px;
      background:#007bff; color:#fff; border:none; border-radius:25px;
      font-size:1.1em; cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn.audio-btn { background:#28a745; }
    .a-enter-vr-button { display:none !important; }

    #dbg {
      position: absolute; top:10px; left:10px;
      background: rgba(0,0,0,.75); color:#ddd;
      padding:8px 12px; font-family: monospace; font-size:12px;
      z-index: 10000; border:1px solid #555; border-radius:4px;
      line-height:1.5;
    }
    #dbg .ok  { color:#4f4; }
    #dbg .err { color:#f55; }
  </style>
</head>
<body style="margin:0; overflow:hidden;">

  <div class="overlay" id="start-overlay">
    <div id="loading-text">名刺データを読み込んでいます...</div>
    <button class="btn" id="start-btn" style="display:none;">🎬 ARを開始する</button>
  </div>

  <div class="overlay hidden" id="audio-overlay">
    <div>🔇 音声はまだミュートです</div>
    <button class="btn audio-btn" id="audio-btn">🔊 音声を有効にする</button>
  </div>

  <div id="dbg">
    <div>Marker:  <span id="dbg-marker" class="err">未認識</span></div>
    <div>Plane:   <span id="dbg-mat"    class="err">未</span></div>
    <div>readySt: <span id="dbg-rs">-</span></div>
    <div>paused:  <span id="dbg-paused">-</span></div>
    <div>curr:    <span id="dbg-ct">-</span></div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <video id="ar-video" src="./0723.mp4" loop
             crossorigin="anonymous"
             playsinline webkit-playsinline
             muted preload="auto"></video>
    </a-assets>

    <!-- ★ ブレを抑えるための smooth を強める -->
    <a-nft
      id="nft"
      type="nft"
      url="https://shou1512.github.io/ar-card/moriwaki"
      smooth="true"
      smoothCount="20"
      smoothTolerance=".001"
      smoothThreshold="2"
    >
      <!--
        ★★★ ここが今回の最大ポイント ★★★
        rotation="0 0 0" → プレーンがカード平面と「垂直」に立つ
        → カメラに正対するので 「名刺の上に人物が立ってる」 ように見える
        position="0 30 8" → カード中央(y=0)から Y方向に 30 (名刺の上にめり込まない高さ)
        width/height は 人物を縦に立たせるための 5:7 比率（動画が縦型ならそのまま使える）
      -->
      <a-plane id="video-plane"
               width="160" height="220"
               position="0 30 8"
               rotation="0 0 0"></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    /* === ユーザーが現場調整する値 === */
    const CONFIG = {
      /*
       * グリーンバックの判定：
       *   - 「緑のチャンネルが赤・青より明らかに大きい」かつ
       *   - 「#00b140 からあまり離れていない」
       *   両方を満たすときだけ透明にする。
       *   → 人間の肌は R>G なので緑のドミナンスが通らない → 透明にならない
       *   → 黄緑の撮影でも chromaDistance を絞れば人物が消えない
       */
      chroma:         { r: 0x00, g: 0xb1, b: 0x40 },   // ★mp4 を送ってもらえれば実色に変更
      chromaDistance: 130,   // chroma 色の許容距離。0に近いほど厳密
      chromaSmooth:   40,    // グラデ境界の幅
      greenRatio:     1.15,  // g が r, b よりどれだけ大きければ「緑」とするか
      minGreenLevel:  60,    // あまりに暗いピクセルは無条件に不透明

      /* canvas 解像度（クロマキー処理用） */
      canvasW: 320,
      canvasH: 240,

      /* ダンピング（ブレ低減） */
      damping: 0.25,
    };
    /* ================================ */

    const startOverlay = document.getElementById('start-overlay');
    const loadingText  = document.getElementById('loading-text');
    const startBtn     = document.getElementById('start-btn');
    const audioOverlay = document.getElementById('audio-overlay');
    const audioBtn     = document.getElementById('audio-btn');
    const nftTarget    = document.getElementById('nft');
    const videoEl      = document.getElementById('ar-video');
    const planeEl      = document.getElementById('video-plane');
    const dbgMarker    = document.getElementById('dbg-marker');
    const dbgMat       = document.getElementById('dbg-mat');

    /* ===== クロマキー用キャンバス ===== */
    const canvas = document.createElement('canvas');
    canvas.width  = CONFIG.canvasW;
    canvas.height = CONFIG.canvasH;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let canvasTex = null;
    let planeMesh = null;
    let dampedInit = false;
    const dampedPos  = { x: 0, y: 30, z: 8 };
    const dampedQuat = new THREE.Quaternion();

    /* ===== plane の mesh.material を canvas テクスチャに丸ごと差し替える ===== */
    function attach() {
      const mesh = planeEl.getObject3D('mesh');
      if (!mesh) { setTimeout(attach, 50); return; }
      planeMesh = mesh;

      canvasTex = new THREE.CanvasTexture(canvas);
      canvasTex.minFilter = THREE.LinearFilter;
      canvasTex.magFilter = THREE.LinearFilter;
      canvasTex.format    = THREE.RGBAFormat;

      mesh.material = new THREE.MeshBasicMaterial({
        map: canvasTex,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      dbgMat.textContent = 'OK';
      dbgMat.className   = 'ok';

      startChroma();
      startDamp();
    }

    /* ===== クロマキー描画ループ ===== */
    function startChroma() {
      function tick() {
        if (canvasTex && videoEl.readyState >= 2 && !videoEl.paused) {
          ctx.drawImage(videoEl, 0, 0, CONFIG.canvasW, CONFIG.canvasH);

          const img  = ctx.getImageData(0, 0, CONFIG.canvasW, CONFIG.canvasH);
          const data = img.data;
          const cr = CONFIG.chroma.r, cg = CONFIG.chroma.g, cb = CONFIG.chroma.b;
          const distThr = CONFIG.chromaDistance;
          const smt      = CONFIG.chromaSmooth;
          const ratio    = CONFIG.greenRatio;
          const minG     = CONFIG.minGreenLevel;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];

            // ① 緑のドミナンス（肌・服を救う主フィルタ）
            //   → g < r*ratio or g < b*ratio なら「緑の支配はしていない」と判定
            const isDominantGreen = (g >= r * ratio) && (g >= b * ratio) && (g >= minG);

            // ② chroma 色との距離（黄緑の撮影に対応）
            const dr = r - cr, dg = g - cg, db = b - cb;
            const dist = Math.sqrt(dr*dr + dg*dg + db*db);

            if (isDominantGreen && dist < distThr) {
              data[i + 3] = 0;                                    // 完全透明
            } else if (isDominantGreen && dist < distThr + smt) {
              // 距離に応じたグラデ境界
              const a = ((dist - distThr) / smt) * 255;
              data[i + 3] = (a | 0);
            }
            // それ以外（=人・服・その他）はそのままだから不透明
          }

          ctx.putImageData(img, 0, 0);
          canvasTex.needsUpdate = true;
        }
        requestAnimationFrame(tick);
      }
      tick();
    }

    /* ===== ダンピング：3D位置を滑らかに追従させる ===== */
    function startDamp() {
      const lerp = (a, b, t) => a + (b - a) * t;
      function tick() {
        if (!planeMesh) { requestAnimationFrame(tick); return; }

        planeEl.object3D.updateMatrixWorld(true);
        const tPos  = new THREE.Vector3();
        const tQuat = new THREE.Quaternion();
        planeEl.object3D.getWorldPosition(tPos);
        planeEl.object3D.getWorldQuaternion(tQuat);

        if (!dampedInit) {
          dampedPos.x = tPos.x;
          dampedPos.y = tPos.y;
          dampedPos.z = tPos.z;
          dampedQuat.copy(tQuat);
          dampedInit = true;
        } else {
          dampedPos.x = lerp(dampedPos.x, tPos.x, CONFIG.damping);
          dampedPos.y = lerp(dampedPos.y, tPos.y, CONFIG.damping);
          dampedPos.z = lerp(dampedPos.z, tPos.z, CONFIG.damping);
          dampedQuat.slerp(tQuat, CONFIG.damping);
        }

        planeMesh.position.set(dampedPos.x, dampedPos.y, dampedPos.z);
        planeMesh.quaternion.copy(dampedQuat);

        requestAnimationFrame(tick);
      }
      tick();
    }

    /* ===== AR.js 制御 ===== */
    function showStartButton() {
      loadingText.innerHTML = '準備完了！<br>ボタンを押して名刺にかざしてください';
      startBtn.style.display = 'block';
    }
    window.addEventListener('arjs-nft-loaded', showStartButton);
    document.querySelector('a-scene').addEventListener('loaded', function () {
      setTimeout(function () {
        if (startBtn.style.display !== 'block') showStartButton();
      }, 2000);
    });

    startBtn.addEventListener('click', function () {
      videoEl.muted = true;
      videoEl.play().then(() => {
        videoEl.pause();
        videoEl.currentTime = 0;
        startOverlay.classList.add('hidden');
        audioOverlay.classList.remove('hidden');
      }).catch(err => {
        console.log('Start play error:', err);
        startOverlay.classList.add('hidden');
      });
    });

    audioBtn.addEventListener('click', function () {
      videoEl.muted = false;
      videoEl.play().then(() => {
        audioOverlay.classList.add('hidden');
      }).catch(err => alert('音声を開始できませんでした: ' + err.message));
    });

    nftTarget.addEventListener('markerFound', function () {
      dbgMarker.textContent = '認識中';
      dbgMarker.className   = 'ok';
      try { videoEl.currentTime = 0; } catch (e) {}
      videoEl.play().catch(() => {});
    });

    nftTarget.addEventListener('markerLost', function () {
      dbgMarker.textContent = '未認識';
      dbgMarker.className   = 'err';
      videoEl.pause();
    });

    planeEl.addEventListener('loaded', attach);

    setInterval(() => {
      document.getElementById('dbg-rs').textContent     = videoEl.readyState;
      document.getElementById('dbg-paused').textContent = String(videoEl.paused);
      document.getElementById('dbg-ct').textContent     = videoEl.currentTime.toFixed(2);
    }, 200);
  </script>
</body>
</html>
