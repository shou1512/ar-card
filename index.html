<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Business Card</title>
  
  <!-- A-Frame & AR.js NFT -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <!-- グリーンバック自動透過シェーダーの登録 -->
  <script>
    AFRAME.registerShader('chromakey', {
      schema: {
        src: {type: 'map'},
        color: {type: 'color', default: {r: 0.0, g: 1.0, b: 0.0}},
        transparent: {default: true}
      },
      init: function (data) {
        var videoEl = typeof data.src === 'string' ? document.querySelector(data.src) : data.src;
        var videoTexture = new THREE.VideoTexture(videoEl);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        
        var material = new THREE.ShaderMaterial({
          uniforms: {
            color: {type: 'c', value: new THREE.Color(data.color)},
            texture: {type: 't', value: videoTexture}
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform vec3 color;
            uniform sampler2D texture;
            varying vec2 vUv;
            void main() {
              vec4 tColor = texture2D(texture, vUv);
              float diff = distance(tColor.rgb, color);
              if (diff < 0.45) {
                discard;
              } else {
                // 胸下のカットラインを滑らかに薄くする処理
                float fade = smoothstep(0.0, 0.15, vUv.y); 
                tColor.a *= fade;
                gl_FragColor = tColor;
              }
            }
          `,
          transparent: true
        });
        this.material = material;
      },
      update: function () {
        if (this.material && this.material.uniforms.texture.value) {
          this.material.uniforms.texture.value.needsUpdate = true;
        }
      }
    });
  </script>

  <style>
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }
    .start-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.1em;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <!-- スタート/ローディング画面 -->
  <div class="arjs-loader" id="loader">
    <div id="loading-text">名刺データを読み込んでいます...</div>
    <button class="start-btn" id="start-btn">ARを開始する</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; alpha: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <video id="ar-video" src="./0723.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
    </a-assets>

    <a-nft
      type="nft"
      url="https://shou1512.github.io/ar-card/moriwaki"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <!-- 
        修正前の <a-video> タグ構造に戻し、クロマキーシェーダーを適用。
        rotation="0 0 0" で垂直に立たせ、position で胸下が隠れるよう調整。
      -->
      <a-video
        src="#ar-video"
        width="120"
        height="160"
        position="80 40 -30"
        rotation="0 0 0"
        material="shader: chromakey; src: #ar-video;"
      ></a-video>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loader = document.getElementById('loader');
    const loadingText = document.getElementById('loading-text');
    const startBtn = document.getElementById('start-btn');
    const nftTarget = document.querySelector('a-nft');
    const video = document.querySelector('#ar-video');

    function showStartButton() {
      loadingText.innerHTML = "準備完了！<br>ボタンを押してカメラにかざしてください";
      startBtn.style.display = 'block';
    }

    // NFTデータまたはシーンのロード完了を検知
    window.addEventListener('arjs-nft-loaded', showStartButton);
    
    document.querySelector('a-scene').addEventListener('loaded', function () {
      setTimeout(function() {
        if (startBtn.style.display !== 'block') {
          showStartButton();
        }
      }, 2000);
    });

    // ボタンを押した時に動画の再生をアンロックしてオーバーレイを消す
    startBtn.addEventListener('click', function() {
      video.play().then(() => {
        video.pause();
        loader.style.display = 'none';
      }).catch(err => {
        console.log("Video play error:", err);
        loader.style.display = 'none';
      });
    });

    // マーカー認識時
    nftTarget.addEventListener('markerFound', function() {
      console.log('Marker Found!');
      video.play();
    });

    // マーカー見失い時
    nftTarget.addEventListener('markerLost', function() {
      console.log('Marker Lost!');
      video.pause();
    });
  </script>
</body>
</html>
