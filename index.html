<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Business Card - 透過動画</title>

  <!-- CDN: 動く版と同一 -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <style>
    .arjs-loader {
      height: 100%; width: 100%;
      position: absolute; top: 0; left: 0;
      background-color: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; font-family: sans-serif;
    }
    .start-btn {
      margin-top: 20px; padding: 14px 28px;
      background-color: #007bff; color: white;
      border: none; border-radius: 25px;
      font-size: 1.1em; cursor: pointer; display: none;
    }
    .a-enter-vr-button { display: none !important; }

    /* 切り分け用 */
    #dbg {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,.75); color: #ddd;
      padding: 8px 12px; font-family: monospace; font-size: 12px;
      z-index: 10000; border: 1px solid #555; border-radius: 4px;
      line-height: 1.5;
    }
    #dbg .ok  { color: #4f4; }
    #dbg .err { color: #f55; }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <div class="arjs-loader" id="loader">
    <div id="loading-text">名刺データを読み込んでいます...</div>
    <button class="start-btn" id="start-btn">ARを開始する</button>
  </div>

  <div id="dbg">
    <div>NFT:        <span id="dbg-marker" class="err">未認識</span></div>
    <div>Plane mat:  <span id="dbg-mat"    class="err">未</span></div>
    <div>readySt:    <span id="dbg-rs">-</span></div>
    <div>paused:     <span id="dbg-paused">-</span></div>
    <div>currTime:   <span id="dbg-ct">-</span></div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <video id="ar-video" src="./0723.mp4" loop
             crossorigin="anonymous" playsinline webkit-playsinline
             muted preload="auto"></video>
    </a-assets>

    <!-- ★★★ ブレ対策 smooth 設定 ★★★
         smoothCount         : 大きいほど滑らか（10→20）
         smoothTolerance     : 小さいほど「微小な揺れ」を無視（.01→.001）
         smoothThreshold     : 特徴点数がこれを下回ると smoothing を弱める -->
    <a-nft
      type="nft"
      url="https://shou1512.github.io/ar-card/moriwaki"
      smooth="true"
      smoothCount="20"
      smoothTolerance=".001"
      smoothThreshold="2"
    >
      <!-- 認識テスト用の小さな赤いマーカー（あとで消してOK） -->
      <a-plane color="#ff2222" width="15" height="15"
               position="0 100 -2" rotation="-90 0 0"></a-plane>

      <!-- ★★★ 動画プレーン ★★★
           material 属性は付けない → A-Frame の material 更新経路を完全回避
           JavaScript 側で mesh.material を直接差し替える -->
      <a-plane id="video-plane"
               width="220" height="124"
               position="0 100 5"
               rotation="-90 0 0"></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    /* ============================================================
       =====  ユーザーが実機調整する 4 つのパラメータはここ  =====
       ============================================================ */
    const CONFIG = {
      // グリーンバック色（#00b140 = 撮影で多い緑、Photoshop のスポイトで取得した値に置き換える）
      chroma:   { r: 0x00, g: 0xb1, b: 0x40 },

      // 透過判定の厳しさ。distance < similarity なら完全透明
      similarity: 180,    // 0〜255 程度。大きいほど広めに消去（人物が透ける時は下げる）

      // 境界のなめらかさ
      smoothness: 40,     // 大きいほど境界がボヤッと

      // グリーンバック処理用の内部キャンバス解像度（上げる = 高精細だが CPU 重い）
      canvasWidth:  320,
      canvasHeight: 180,
    };
    /* ============================================================ */

    /* ------------------------  DOM参照  ------------------------ */
    const loader      = document.getElementById('loader');
    const loadingText = document.getElementById('loading-text');
    const startBtn    = document.getElementById('start-btn');
    const nftTarget   = document.querySelector('a-nft');
    const videoEl     = document.querySelector('#ar-video');
    const planeEl     = document.querySelector('#video-plane');
    const dbgMarker   = document.getElementById('dbg-marker');
    const dbgMat      = document.getElementById('dbg-mat');

    /* ------------------------  キャンバス作成（クロマキー用）  ------------------------ */
    const chromaCanvas = document.createElement('canvas');
    chromaCanvas.width  = CONFIG.canvasWidth;
    chromaCanvas.height = CONFIG.canvasHeight;
    const chromaCtx = chromaCanvas.getContext('2d', { willReadFrequently: true });

    /* ------------------------  GPU テクスチャ  ------------------------ */
    let canvasTexture = null;

    /* ------------------------  requestAnimationFrame のクロマキー描画ループ  --
       動画の各フレームを canvas にコピー → ピクセル単位でグリーンバックを透明に
       → その canvas をテクスチャとして plane に貼る（A-Frame の Shader は使わない） */
    function chromaFrame() {
      if (canvasTexture && videoEl.readyState >= 2 && !videoEl.paused) {
        // 1) 動画フレームを canvas に描画
        chromaCtx.drawImage(videoEl, 0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        // 2) ピクセル単位でグリーンバックを透明化
        const img = chromaCtx.getImageData(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
        const d   = img.data;

        const cr = CONFIG.chroma.r;
        const cg = CONFIG.chroma.g;
        const cb = CONFIG.chroma.b;
        const sim = CONFIG.similarity;
        const smt = CONFIG.smoothness;

        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i + 1], b = d[i + 2];
          const dr = r - cr, dg = g - cg, db = b - cb;
          const dist = Math.sqrt(dr * dr + dg * dg + db * db);

          if (dist < sim) {
            d[i + 3] = 0;                                // 完全透明
          } else if (dist < sim + smt) {
            const a = ((dist - sim) / smt) * 255;
            d[i + 3] = a | 0;                            // グラデ境界
          }
        }

        chromaCtx.putImageData(img, 0, 0);

        // 3) テクスチャ更新フラグ
        canvasTexture.needsUpdate = true;
      }
      requestAnimationFrame(chromaFrame);
    }

    /* ------------------------  plane のマテリアルを差し替える関数  --
       A-Frame が普通に作った mesh.material を捨てて、
       「canvas テクスチャを使う MeshBasicMaterial」に丸ごと差し替える */
    function attachChromaToPlane() {
      const mesh = planeEl.getObject3D('mesh');
      if (!mesh) {
        // まだ mesh が来てない。少し待って再試行
        setTimeout(attachChromaToPlane, 50);
        return;
      }

      canvasTexture = new THREE.CanvasTexture(chromaCanvas);
      canvasTexture.minFilter = THREE.LinearFilter;
      canvasTexture.magFilter = THREE.LinearFilter;
      canvasTexture.format    = THREE.RGBAFormat;

      mesh.material = new THREE.MeshBasicMaterial({
        map: canvasTexture,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false   // 透過のエッジで隠れる問題を防ぐ（A-Frame のベストプラクティス）
      });

      dbgMat.textContent = 'OK';
      dbgMat.className   = 'ok';

      // 描画ループ開始
      chromaFrame();
    }

    // a-plane が「loaded」になった後で material 差し替えを試みる
    planeEl.addEventListener('loaded', attachChromaToPlane);

    /* ------------------------  AR.js マーカーイベント  ------------------------ */
    function showStartButton() {
      loadingText.innerHTML = "準備完了！<br>ボタンを押して名刺にかざしてください";
      startBtn.style.display = 'block';
    }
    window.addEventListener('arjs-nft-loaded', showStartButton);
    document.querySelector('a-scene').addEventListener('loaded', function () {
      setTimeout(function () {
        if (startBtn.style.display !== 'block') showStartButton();
      }, 2000);
    });

    startBtn.addEventListener('click', function () {
      // モバイル Safari の自動再生制限を解除するため、ユーザージェスチャで 1 回だけ play → pause
      videoEl.muted = true;
      videoEl.play().then(() => {
        videoEl.pause();
        videoEl.currentTime = 0;
        loader.style.display = 'none';
      }).catch(err => console.log('Start play error:', err));
    });

    nftTarget.addEventListener('markerFound', function () {
      console.log('Marker Found!');
      dbgMarker.textContent = '認識中';
      dbgMarker.className   = 'ok';
      try { videoEl.currentTime = 0; } catch (e) {}
      videoEl.play().catch(e => console.log('Play error:', e));
    });

    nftTarget.addEventListener('markerLost', function () {
      console.log('Marker Lost!');
      dbgMarker.textContent = '未認識';
      dbgMarker.className   = 'err';
      videoEl.pause();
    });

    /* ------------------------  デバッグパネル更新  ------------------------ */
    setInterval(() => {
      document.getElementById('dbg-rs').textContent     = videoEl.readyState;
      document.getElementById('dbg-paused').textContent = String(videoEl.paused);
      document.getElementById('dbg-ct').textContent     = videoEl.currentTime.toFixed(2);
    }, 200);
  </script>
</body>
</html>
