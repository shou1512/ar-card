<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Business Card</title>
  
  <!-- A-Frame & AR.js NFT -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    /* ローディング 兼 スタート画面 */
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }
    .start-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.1em;
      cursor: pointer;
      display: none; /* 読み込み完了後に表示 */
    }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <!-- スタート/ローディング画面 -->
  <div class="arjs-loader" id="loader">
    <div id="loading-text">名刺データを読み込んでいます...</div>
    <button class="start-btn" id="start-btn">ARを開始する</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <!-- autoplayを外し、手動再生コントロールにします -->
      <video id="ar-video" src="./0723.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <!-- urlは拡張子を含まないファイル名パス（同じフォルダにある場合: moriwaki） -->
    <a-nft
      type="nft"
      url="moriwaki"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <a-video
        src="#ar-video"
        width="160"
        height="90"
        position="50 0 -100"
        rotation="-90 0 0"
      ></a-video>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loader = document.getElementById('loader');
    const loadingText = document.getElementById('loading-text');
    const startBtn = document.getElementById('start-btn');
    const nftTarget = document.querySelector('a-nft');
    const video = document.querySelector('#ar-video');

    // 1. NFTデータ読み込み完了時
    window.addEventListener('arjs-nft-loaded', function () {
      loadingText.innerHTML = "準備完了！<br>ボタンを押してカメラにかざしてください";
      startBtn.style.display = 'block';
    });

    // 2. ボタンを押した時にスマホの動画再生権限を解除して画面を消す
    startBtn.addEventListener('click', function() {
      // 一瞬再生して停止することで、スマホの音声・動画ロックを解除する
      video.play().then(() => {
        video.pause();
        loader.style.display = 'none';
      }).catch(err => {
        console.log("Video play error:", err);
        loader.style.display = 'none';
      });
    });

    // 3. マーカー認識時の処理
    nftTarget.addEventListener('markerFound', function() {
      video.play();
    });

    // 4. マーカー見失い時の処理
    nftTarget.addEventListener('markerLost', function() {
      video.pause();
    });
  </script>
</body>
</html>
