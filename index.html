<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Business Card - 透過動画（修正 v3）</title>

  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <!-- chromakey シェーダー（A-Frame 1.3 同梱の THREE.js r137 互換）
       ※ material="..." には shader と src 以外を書かないこと（color/similarity は書かない） -->
  <script>
    AFRAME.registerShader('chromakey', {
      schema: {
        color:      { type: 'color',  default: '#00b140' },
        similarity: { type: 'number', default: 0.40 },
        smoothness: { type: 'number', default: 0.10 }
      },

      init: function () {
        // ★自前で VideoTexture を毎回ラップする（A-Frame の type: 'map' 経由は不安）
        const videoEl = document.querySelector('#ar-video');
        const tex = new THREE.VideoTexture(videoEl);
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.format    = THREE.RGBAFormat;
        // colorSpace には触らない（r137 には存在しない）

        this.material = new THREE.ShaderMaterial({
          uniforms: {
            texture:    { value: tex },
            color:      { value: new THREE.Color(this.data.color) },
            similarity: { value: this.data.similarity },
            smoothness: { value: this.data.smoothness }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D texture;
            uniform vec3      color;
            uniform float     similarity;
            uniform float     smoothness;
            varying vec2      vUv;

            void main() {
              vec4 tex = texture2D(texture, vUv);
              // グリーンバックに近いほど透明に
              float d = distance(tex.rgb, color);
              float a = smoothstep(similarity, similarity + smoothness, d);
              gl_FragColor = vec4(tex.rgb, a);
            }
          `,
          transparent: true,
          side: THREE.DoubleSide
        });

        this.el.material = this.material;
      },

      // ★data の存在チェックを厳密にして、絶対に undefined 参照を出さない
      update: function (data) {
        if (!this.material) return;
        if (data.color      && this.material.uniforms.color)
          this.material.uniforms.color.value.set(data.color);
        if (data.similarity != null && this.material.uniforms.similarity)
          this.material.uniforms.similarity.value = data.similarity;
        if (data.smoothness != null && this.material.uniforms.smoothness)
          this.material.uniforms.smoothness.value = data.smoothness;
      }
    });
  </script>

  <style>
    .arjs-loader {
      height: 100%; width: 100%;
      position: absolute; top: 0; left: 0;
      background-color: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; font-family: sans-serif;
    }
    .start-btn {
      margin-top: 20px; padding: 14px 28px;
      background-color: #007bff; color: white;
      border: none; border-radius: 25px;
      font-size: 1.1em; cursor: pointer; display: none;
    }
    .a-enter-vr-button { display: none !important; }

    #dbg {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,.75); color: #ddd;
      padding: 8px 12px; font-family: monospace; font-size: 12px;
      z-index: 10000; border: 1px solid #555; border-radius: 4px;
      line-height: 1.5;
    }
    #dbg .ok  { color: #4f4; }
    #dbg .err { color: #f55; }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <div class="arjs-loader" id="loader">
    <div id="loading-text">名刺データを読み込んでいます...</div>
    <button class="start-btn" id="start-btn">ARを開始する</button>
  </div>

  <div id="dbg">
    <div>NFT認識: <span id="dbg-marker" class="err">未認識</span></div>
    <div>Shader:  <span id="dbg-shader" class="err">未起動</span></div>
    <div>readyState: <span id="dbg-rs">-</span></div>
    <div>paused:     <span id="dbg-paused">-</span></div>
    <div>currTime:   <span id="dbg-ct">-</span></div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <video id="ar-video" src="./0723.mp4" loop
             crossorigin="anonymous" playsinline webkit-playsinline
             muted preload="auto"></video>
    </a-assets>

    <a-nft
      type="nft"
      url="https://shou1512.github.io/ar-card/moriwaki"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <!-- ★赤いプレーン：これが見えれば AR 認識 OK -->
      <a-plane color="#ff2222" width="20" height="20"
               position="0 70 0" rotation="-90 0 0"></a-plane>

      <!-- ★透過動画プレーン
           material には「shader と src」だけ書く。color/similarity は絶対に書かない
           （A-Frame の material パーサが ShaderMaterial に .color を set しようとして落ちる） -->
      <a-entity
        id="video-plane"
        geometry="primitive: plane; width: 240; height: 135"
        material="shader: chromakey; src: #ar-video; transparent: true"
        position="0 70 2"
        rotation="-90 0 0"
      ></a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loader      = document.getElementById('loader');
    const loadingText = document.getElementById('loading-text');
    const startBtn    = document.getElementById('start-btn');
    const nftTarget   = document.querySelector('a-nft');
    const video       = document.querySelector('#ar-video');
    const dbgMarker   = document.getElementById('dbg-marker');
    const dbgShader   = document.getElementById('dbg-shader');

    function showStartButton() {
      loadingText.innerHTML = "準備完了！<br>ボタンを押して名刺にかざしてください";
      startBtn.style.display = 'block';
    }
    window.addEventListener('arjs-nft-loaded', showStartButton);
    document.querySelector('a-scene').addEventListener('loaded', function () {
      setTimeout(function () {
        if (startBtn.style.display !== 'block') showStartButton();
      }, 2000);
    });

    // シェーダーが init されたかを検知（死ぬ前にログを出せるように）
    const planeEl = document.querySelector('#video-plane');
    planeEl.addEventListener('loaded', function () {
      // A-Frame は登録済みカスタムシェーダーの init をコンポーネント attach 時に呼ぶ
      // 取り急ぎ 0.5 秒後に Shader DBG を「起動」に
      setTimeout(() => {
        if (planeEl.components && planeEl.components.material) {
          dbgShader.textContent = '起動';
          dbgShader.className   = 'ok';
        } else {
          dbgShader.textContent = 'component無し';
          dbgShader.className   = 'err';
        }
      }, 500);
    });

    // スタートボタン（モバイル Safari 用のユーザー操作アンロック）
    startBtn.addEventListener('click', function () {
      video.muted = true;
      video.play().then(() => {
        video.pause();
        video.currentTime = 0;
        loader.style.display = 'none';
      }).catch(err => console.log('Start play error:', err));
    });

    nftTarget.addEventListener('markerFound', function () {
      console.log('Marker Found!');
      dbgMarker.textContent = '認識中';
      dbgMarker.className   = 'ok';
      try { video.currentTime = 0; } catch (e) {}
      video.play().catch(e => console.log('Play error:', e));
    });

    nftTarget.addEventListener('markerLost', function () {
      console.log('Marker Lost!');
      dbgMarker.textContent = '未認識';
      dbgMarker.className   = 'err';
      video.pause();
    });

    // 動画状態ログ
    setInterval(() => {
      document.getElementById('dbg-rs').textContent     = video.readyState;
      document.getElementById('dbg-paused').textContent = String(video.paused);
      document.getElementById('dbg-ct').textContent     = video.currentTime.toFixed(2);
    }, 200);
  </script>
</body>
</html>
