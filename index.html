<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Business Card - 透過動画（mesh.material 差し替え版）</title>

  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <style>
    .arjs-loader {
      height: 100%; width: 100%;
      position: absolute; top: 0; left: 0;
      background-color: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; font-family: sans-serif;
    }
    .start-btn {
      margin-top: 20px; padding: 14px 28px;
      background-color: #007bff; color: white;
      border: none; border-radius: 25px;
      font-size: 1.1em; cursor: pointer; display: none;
    }
    .a-enter-vr-button { display: none !important; }

    /* 切り分け用デバッグパネル */
    #dbg {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,.75); color: #ddd;
      padding: 8px 12px; font-family: monospace; font-size: 12px;
      z-index: 10000; border: 1px solid #555; border-radius: 4px;
      line-height: 1.5;
    }
    #dbg .ok  { color: #4f4; }
    #dbg .err { color: #f55; }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <div class="arjs-loader" id="loader">
    <div id="loading-text">名刺データを読み込んでいます...</div>
    <button class="start-btn" id="start-btn">ARを開始する</button>
  </div>

  <div id="dbg">
    <div>NFT認識:        <span id="dbg-marker" class="err">未認識</span></div>
    <div>videoPlane mat: <span id="dbg-mat"    class="err">未設定</span></div>
    <div>mp4 readyState: <span id="dbg-rs">-</span></div>
    <div>mp4 paused:     <span id="dbg-paused">-</span></div>
    <div>mp4 currTime:   <span id="dbg-ct">-</span></div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <video id="ar-video" src="./0723.mp4" loop
             crossorigin="anonymous" playsinline webkit-playsinline
             muted preload="auto"></video>
    </a-assets>

    <a-nft
      type="nft"
      url="https://shou1512.github.io/ar-card/moriwaki"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <!-- ★マーカー認識テスト用赤いプレーン -->
      <a-plane color="#ff2222" width="20" height="20"
               position="0 70 0" rotation="-90 0 0"></a-plane>

      <!-- ★透過動画プレーン。
           material="..." を一切書かない。これで A-Frame material コンポーネントの
           updateShader() 経路は一度も発火しない（JavaScriptで直接差し替えるため）。 -->
      <a-plane id="video-plane"
               width="240" height="135"
               position="0 70 2"
               rotation="-90 0 0"></a-plane>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loader      = document.getElementById('loader');
    const loadingText = document.getElementById('loading-text');
    const startBtn    = document.getElementById('start-btn');
    const nftTarget   = document.querySelector('a-nft');
    const videoEl     = document.querySelector('#ar-video');
    const videoPlane  = document.querySelector('#video-plane');
    const dbgMarker   = document.getElementById('dbg-marker');
    const dbgMat      = document.getElementById('dbg-mat');

    /* ============================================================
       クロマキーシェーダーマテリアルを構築する関数
       VideoTexture を毎回ラップし、細かい pixel 単位の色比較で透過する
       ============================================================ */
    function buildChromaMaterial(vid) {
      const tex = new THREE.VideoTexture(vid);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.format    = THREE.RGBAFormat;

      return new THREE.ShaderMaterial({
        uniforms: {
          texture:    { value: tex },
          chroma:     { value: new THREE.Color('#00b140') },
          similarity: { value: 0.40 },
          smoothness: { value: 0.10 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D texture;
          uniform vec3      chroma;
          uniform float     similarity;
          uniform float     smoothness;
          varying vec2      vUv;
          void main() {
            vec4 c = texture2D(texture, vUv);
            float d = distance(c.rgb, chroma);
            float a = smoothstep(similarity, similarity + smoothness, d);
            gl_FragColor = vec4(c.rgb, a);
          }
        `,
        transparent: true,
        side: THREE.DoubleSide
      });
    }

    /* ============================================================
       a-plane の mesh.material を直接 ShaderMaterial に差し替える
       A-Frame material コンポーネントは一切触らない
       ============================================================ */
    function attachShaderToPlane(planeEl) {
      function tryAttach() {
        const mesh = planeEl.getObject3D('mesh');
        if (!mesh) return false;
        // 置き換え
        mesh.material = buildChromaMaterial(videoEl);
        dbgMat.textContent = 'OK';
        dbgMat.className   = 'ok';
        return true;
      }

      // entity が loaded した後でないとにgetObject3D('mesh') ができない
      if (!tryAttach()) {
        planeEl.addEventListener('loaded', () => {
          if (!tryAttach()) {
            setTimeout(tryAttach, 100);
          }
        });
      }
    }

    attachShaderToPlane(videoPlane);

    /* ============================================================
       AR.js 関連（動く版と同一）
       ============================================================ */
    function showStartButton() {
      loadingText.innerHTML = "準備完了！<br>ボタンを押して名刺にかざしてください";
      startBtn.style.display = 'block';
    }
    window.addEventListener('arjs-nft-loaded', showStartButton);
    document.querySelector('a-scene').addEventListener('loaded', function () {
      setTimeout(function () {
        if (startBtn.style.display !== 'block') showStartButton();
      }, 2000);
    });

    startBtn.addEventListener('click', function () {
      videoEl.muted = true;
      videoEl.play().then(() => {
        videoEl.pause();
        videoEl.currentTime = 0;
        loader.style.display = 'none';
      }).catch(err => console.log('Start play error:', err));
    });

    nftTarget.addEventListener('markerFound', function () {
      console.log('Marker Found!');
      dbgMarker.textContent = '認識中';
      dbgMarker.className   = 'ok';
      try { videoEl.currentTime = 0; } catch (e) {}
      videoEl.play().catch(e => console.log('Play error:', e));
    });

    nftTarget.addEventListener('markerLost', function () {
      console.log('Marker Lost!');
      dbgMarker.textContent = '未認識';
      dbgMarker.className   = 'err';
      videoEl.pause();
    });

    setInterval(() => {
      document.getElementById('dbg-rs').textContent     = videoEl.readyState;
      document.getElementById('dbg-paused').textContent = String(videoEl.paused);
      document.getElementById('dbg-ct').textContent     = videoEl.currentTime.toFixed(2);
    }, 200);
  </script>
</body>
</html>
